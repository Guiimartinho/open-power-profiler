name: Firmware

# Runs on demand only for now (decision D-22 of the specification). Start
# it from the Actions tab or with "gh workflow run firmware.yml". To run it
# on every change again, restore the triggers kept below as comments.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "firmware/**"
  #     - "protocol/**"
  #     - ".github/workflows/firmware.yml"
  # pull_request:
  #   paths:
  #     - "firmware/**"
  #     - "protocol/**"
  #     - ".github/workflows/firmware.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/test/host
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
          python -m pip install gcovr==8.6

      - name: Build and run the tests
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug

      - name: Build and run the tests with coverage instrumentation
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage

      - name: Check the coverage floors
        run: cmake --build --preset coverage --target coverage

      - name: Add the coverage summary to the job summary
        if: always()
        working-directory: firmware
        run: |
          {
            echo '### Firmware coverage (hardware-independent code)'
            echo
            echo '```text'
            gcovr --txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-coverage
          path: firmware/test/host/build/coverage/coverage*
          if-no-files-found: warn

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/test/host
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Lower the address space randomization
        # The sanitizer runtimes cannot map their shadow memory with the
        # default of recent kernels.
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Address and undefined-behavior sanitizers
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize
          ctest --preset sanitize

      - name: Thread sanitizer
        run: |
          cmake --preset tsan
          cmake --build --preset tsan
          ctest --preset tsan

  static-analysis:
    name: Format and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/test/host
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build cppcheck
          python -m pip install clang-format==22.1.4 clang-tidy==22.1.8

      - name: Show the tool versions
        run: |
          clang-format --version
          clang-tidy --version
          cppcheck --version

      - name: Configure
        run: cmake --preset debug

      - name: Check the formatting
        run: cmake --build --preset debug --target format-check

      - name: Run clang-tidy
        run: cmake --build --preset debug --target tidy

      - name: Run cppcheck
        run: cmake --build --preset debug --target cppcheck

  build:
    name: Pico 2 build
    runs-on: ubuntu-latest
    env:
      # Release of the Pico SDK the firmware is built with.
      PICO_SDK_VERSION: "2.3.1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Fetch the Pico SDK
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

      - name: Build for the Pico 2
        # The SDK builds its own picotool when none is installed.
        working-directory: firmware
        run: |
          cmake --preset pico2
          cmake --build --preset pico2

      - name: Add the size report to the job summary
        working-directory: firmware
        run: |
          {
            echo '### Firmware size'
            echo
            echo '```text'
            arm-none-eabi-size build/pico2/power_profiler.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: firmware-pico2
          path: |
            firmware/build/pico2/power_profiler.uf2
            firmware/build/pico2/power_profiler.elf
            firmware/build/pico2/power_profiler.elf.map
          if-no-files-found: error
